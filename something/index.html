<!DOCTYPE html>
<html>

<head>
    <title>Something</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

        html {
            background-color: #b8b8b8;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            color: black;
            font-family: Inter, sans-serif;
            user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #start,
        #main,
        #gameover,
        noscript {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }

        .hidden {
            display: none !important;
        }

        .nothing {
            position: absolute;
            bottom: 16px;
            left: 16px;
            color: black;
            opacity: 0.3;
            transition: opacity 0.15s ease-in-out;
        }

        .nothing:hover {
            opacity: 1.0;
        }        
    </style>
</head>

<body>
    <noscript>
        <h1>The False Something.</h1>
        <span>You have JavaScript disabled, so the website can't detect if you don't do anything.</span>
    </noscript>
    <div id="start" class="hidden">
        <h1>Something.</h1>
        <span>Click the page to start doing something.</span>
        <a href=".." class="nothing">Go back to doing Nothing</a>
    </div>
    <div id="main" class="hidden">
        <span>You've been doing <strong>Something</strong> for <strong id="main-time">0 seconds</strong>.</span>
    </div>
    <div id="gameover" class="hidden">
        <h1>You did Nothing.</h1>
        <span>You spent <strong id="gameover-time">0 seconds</strong> doing <strong>Something</strong>.</span>
        <small>Returning to start screen in <strong id="gameover-return">5 seconds</strong>...</small>
    </div>
</body>

<script type="module">
    const startView = document.querySelector('#start');
    const mainView = document.querySelector('#main');
    const gameOverView = document.querySelector('#gameover');

    const mainTime = document.querySelector('#main-time');
    const gameOverTime = document.querySelector('#gameover-time');
    const gameOverReturn = document.querySelector('#gameover-return');

    window.addEventListener('DOMContentLoaded', () => {
        startView.classList.remove('hidden');
    })

    let doingSomething = false;

    let startedDoingSomething = NaN;
    let tickInterval = null;

    let gameOverStart = NaN;
    let gameOverInterval = null;

    function formatTime(totalSeconds) {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        if (minutes === 0) {
            return `${seconds} second${seconds === 1 ? '' : 's'}`;
        }

        if (seconds === 0) {
            return `${minutes} minute${minutes === 1 ? '' : 's'}`;
        }

        return `${minutes} minute${minutes === 1 ? '' : 's'}, ${seconds} second${seconds === 1 ? '' : 's'}`;
    }

    const interactionEvents = [
        "pointerdown",
        "keydown",
        "scroll",
        "pointermove",
        "touchstart",
        "blur",
        "wheel",
        "touchmove",
        "focus",
        "contextmenu",
        "dragstart",
        "drop",
        "copy",
        "cut",
        "paste"
    ]

    let didSomethingLastTick = true;

    function userDidSomething(e) {
        if (!doingSomething) return;
        if (e.cancelable) {
            e.preventDefault();
        }

        didSomethingLastTick = true;
    }

    function tick() {
        if (didSomethingLastTick) {
            const time = Math.floor((Date.now() - startedDoingSomething) / 1000);
            mainTime.textContent = formatTime(time);
            didSomethingLastTick = false;
        } else {
            clearInterval(tickInterval);

            for (const event of interactionEvents) {
                console.log("Unregistered", event)
                window.removeEventListener(event, userDidSomething);
            }
            console.log("Unregistered visibilitychange")
            document.removeEventListener("visibilitychange", userDidSomething)

            const time = Math.floor((Date.now() - startedDoingSomething) / 1000);

            gameOverTime.textContent = formatTime(time);

            gameOverView.classList.remove('hidden');
            mainView.classList.add('hidden');

            document.title = "You did Nothing."

            gameOverStart = Date.now();
            gameOverTick();
            gameOverInterval = setInterval(gameOverTick, 1000);
        }
    }

    function gameOverTick() {
        const elapsed = Math.floor((Date.now() - gameOverStart) / 1000);
        const time = 5 - elapsed;

        gameOverReturn.textContent = formatTime(time);

        if (time <= 0) {
            gameOverView.classList.add('hidden');
            startView.classList.remove('hidden');
            clearInterval(gameOverInterval);
            document.title = "Nothing"
        }
    }

    window.addEventListener('click', (e) => {
        if (e.target.tagName == "A" && !startView.classList.contains('hidden')) return;

        if (!doingSomething && !startView.classList.contains('hidden')) {
            mainTime.textContent = "0 seconds"
            gameOverTime.textContent = "0 seconds"

            gameOverView.classList.add('hidden')
            startView.classList.add('hidden')
            mainView.classList.remove('hidden');
            startedDoingSomething = Date.now();
            document.title = "You're doing Something."
            tickInterval = setInterval(tick, 500);
            doingSomething = true;

            for (const event of interactionEvents) {
                console.log("Registered", event)
                window.addEventListener(event, userDidSomething);
            }
            console.log("Registered visibilitychange")
            document.addEventListener("visibilitychange", userDidSomething)
        }
    });
</script>

</html>
